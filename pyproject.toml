[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dssential"
version = "0.2.0"
description = "Local-first validated forecasting and transparent scenario analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "mcp>=1.26,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.41,<2",
]

[project.scripts]
dssential-mcp = "dssential.mcp_server:main"

[project.optional-dependencies]
cloud = [
  "anthropic>=0.52,<1",
  "google-genai>=1.16,<2",
  "openai>=1.84,<3",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
release = ["cyclonedx-bom>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["anthropic", "google", "google.*", "mcp", "mcp.*", "openai"]
ignore_missing_imports = true
