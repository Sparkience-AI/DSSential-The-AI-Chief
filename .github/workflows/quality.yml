name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    uses: Sparkience-AI/.github/.github/workflows/reusable-python-quality.yml@adc5b60771b32fbf93f28304fbcf2dd5ad4a0464
    with:
      python-version: "3.12"
      run-type-check: true

  docs:
    uses: Sparkience-AI/.github/.github/workflows/reusable-docs-geo.yml@adc5b60771b32fbf93f28304fbcf2dd5ad4a0464

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Verify lock and build distributions
        run: |
          uv lock --check
          uv build --no-sources
      - name: Smoke-test installed wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .wheel-smoke/bin/python -c "import dssential"
